<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vox Nutrition Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <img src="./logo.png" alt="Vox Nutrition" />
        <div>
          <p>OEM Intake Admin</p>
          <h1>Client Requests</h1>
        </div>
      </header>

      <section class="token-panel">
        <label>
          <span>Admin token</span>
          <input id="adminToken" type="password" placeholder="Only required if ADMIN_TOKEN is configured" />
        </label>
        <button id="saveToken" type="button">Save token</button>
        <button id="refreshList" type="button">Refresh</button>
      </section>

      <section class="admin-grid">
        <div class="list-panel">
          <div class="panel-title">
            <h2>Submissions</h2>
            <span id="countBadge">0</span>
          </div>
          <div id="submissionList" class="submission-list"></div>
        </div>

        <article class="detail-panel" id="detailPanel">
          <p class="empty-state">Select a request to view details.</p>
        </article>
      </section>

      <p id="adminStatus" class="admin-status" role="status" aria-live="polite"></p>
    </main>

    <script src="./admin.js"></script>
  </body>
</html>
